<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Word Adventure | Choose Your Path</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@400;700;900&display=swap');
        body { font-family: 'Lexend', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center p-6 text-center">

    <div class="max-w-5xl">
        <h1 class="text-6xl font-black text-slate-900 mb-4 tracking-tight">
            Hello, <span class="text-indigo-600">Reader!</span>
        </h1>
        <p class="text-2xl text-slate-600 mb-12 font-medium">What would you like to do today?</p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <a href="lab.html" class="group bg-white p-10 rounded-3xl shadow-xl hover:shadow-2xl transition-all border-b-8 border-teal-500 hover:-translate-y-2">
                <div class="w-24 h-24 bg-teal-100 text-teal-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-6 group-hover:bg-teal-600 group-hover:text-white transition-colors">
                    <i class="fas fa-flask"></i>
                </div>
                <h2 class="text-3xl font-black text-slate-800 mb-4 tracking-tight">Word Lab</h2>
                <p class="text-slate-500 font-medium">Explore 32 different word families and hear how they sound!</p>
            </a>

            <a href="adventure.html" class="group bg-white p-10 rounded-3xl shadow-xl hover:shadow-2xl transition-all border-b-8 border-indigo-500 hover:-translate-y-2">
                <div class="w-24 h-24 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-4xl mx-auto mb-6 group-hover:bg-indigo-600 group-hover:text-white transition-colors">
                    <i class="fas fa-mountain"></i>
                </div>
                <h2 class="text-3xl font-black text-slate-800 mb-4 tracking-tight">Story Quest</h2>
                <p class="text-slate-500 font-medium">Read Jack's story and practice your speaking with your AI buddy!</p>
            </a>
        </div>
        
        <footer class="mt-16 text-slate-400 font-bold uppercase tracking-widest text-sm">
            Learn • Practice • Play
        </footer>
    </div>

</body>
</html>
